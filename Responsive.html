<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiStep-Form</title>
    <link rel="stylesheet" href="/Responsive.css" />
    <link rel="icon" href="/asset/image/favicon-32x32.png" />
  </head>
  <body>
    <div class="all">
      <div class="bg-img">
        <div class="steps">
          <div class="step-1">
            <div><h1>1</h1></div>
            <div class="step1">
              <h4>STEP 1</h4>
              <h3>YOUR INFO</h3>
            </div>
          </div>

          <div class="step-2">
            <div><h1>2</h1></div>
            <div class="step2">
              <h4>STEP 2</h4>
              <h3>SELECT PLAN</h3>
            </div>
          </div>

          <div class="step-2">
            <div><h1>3</h1></div>
            <div class="step2">
              <h4>STEP 2</h4>
              <h3>ADD-ONS</h3>
            </div>
          </div>

          <div class="step-2">
            <div><h1>4</h1></div>
            <div class="step2">
              <h4>STEP 2</h4>
              <h3>SUMMARY</h3>
            </div>
          </div>
        </div>
      </div>

      <div class="personal-info">
        <h1>Personal info</h1>
        <p>please provide your name,email address and phone number</p>
        <form action="">
          <div class="Name">
            <span>Name</span>
            <input type="text" placeholder="e.g.Stephen King" id="name" />
          </div>

          <div>
            <span>Email Address</span>
            <input
              type="text"
              placeholder="e.g.stephenking@lorem.com"
              id="email"
            />
          </div>

          <div class="number">
            <span>Phone Number</span>
            <input type="text" placeholder="e.g.+1 234 567 890" id="numb" />
          </div>
        </form>
        <div class="button">
          <p class="btn">Next Step</p>
        </div>
      </div>
    </div>
  </body>
</html>
